name: AgentTimeWidget
options:
  deploymentTarget:
    macOS: "13.5"
  developmentLanguage: en
targets:
  AgentTimeWidget:
    type: app-extension
    platform: macOS
    sources:
      - AgentTimeWidget.swift
      - Snapshot.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Agent Time
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ezyo.agenttime.widget
        PRODUCT_NAME: AgentTimeWidget
        MARKETING_VERSION: "0.2.0-beta.5"
        CURRENT_PROJECT_VERSION: "0.2.0-beta.5"
        MACOSX_DEPLOYMENT_TARGET: "13.5"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: NO
